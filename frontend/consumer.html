<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapCloud — Discover</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .consumer-layout { display: grid; grid-template-columns: 1fr 240px; gap: 24px; align-items: start; }
    .sidebar-col { position: sticky; top: 76px; }
    .load-more-wrap { text-align: center; padding: 24px 0; }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="navbar-inner">
    <a href="consumer.html" class="logo">snap<span>cloud</span></a>
    <div class="nav-right">
      <div class="nav-user" id="nav-user-info"></div>
      <button class="btn btn-outline btn-sm" id="nav-logout">Sign out</button>
    </div>
  </div>
</nav>

<div class="container page-wrap">
  <!-- SEARCH + FILTERS -->
  <div style="margin-bottom:20px">
    <div class="search-bar" style="margin-bottom:12px">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" class="search-input" id="search-input" placeholder="Search photos by title, caption, or tag…" oninput="debounceSearch()">
    </div>
    <div class="filter-row" id="filter-row">
      <button class="filter-pill active" onclick="setFilter('all', this)">All</button>
      <button class="filter-pill" onclick="setFilter('nature', this)">Nature</button>
      <button class="filter-pill" onclick="setFilter('urban', this)">Urban</button>
      <button class="filter-pill" onclick="setFilter('architecture', this)">Architecture</button>
      <button class="filter-pill" onclick="setFilter('portrait', this)">Portraits</button>
      <button class="filter-pill" onclick="setFilter('top', this)">Top rated</button>
    </div>
  </div>

  <div class="consumer-layout">
    <!-- FEED -->
    <div>
      <div class="feed-grid" id="feed-grid">
        ${[1,2,3,4].map(() => `<div class="feed-card" style="pointer-events:none"><div class="feed-card-img" style="background:#f1f0ea"></div><div class="feed-card-body"><div style="height:13px;background:#f1f0ea;border-radius:4px;margin-bottom:8px"></div><div style="height:24px;background:#f1f0ea;border-radius:4px;margin-bottom:10px"></div><div style="height:12px;background:#f1f0ea;border-radius:4px;width:60%"></div></div></div>`).join('')}
      </div>
      <div class="load-more-wrap" id="load-more-wrap" style="display:none">
        <button class="btn btn-outline" onclick="loadMore()">Load more photos</button>
      </div>
    </div>

    <!-- SIDEBAR -->
    <div class="sidebar-col">
      <div class="sidebar-section">
        <div class="card">
          <div class="card-header"><h4>Trending now</h4></div>
          <div class="card-body" id="trending-list">
            <div class="spinner"></div>
          </div>
        </div>
      </div>
      <div class="sidebar-section">
        <div class="card">
          <div class="card-header"><h4>Creators to follow</h4></div>
          <div class="card-body" id="creators-list">
            <div class="spinner"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- PHOTO DETAIL MODAL -->
<div class="modal-overlay" id="photo-modal">
  <div class="modal-box">
    <div class="modal-img-wrap">
      <img id="modal-photo-img" src="" alt="">
      <button class="modal-close" onclick="closeModal('photo-modal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-meta-row" id="modal-meta"></div>
      <div class="modal-caption" id="modal-caption"></div>
      <div class="modal-tags" id="modal-tags"></div>

      <div class="modal-divider"></div>

      <!-- RATING -->
      <div class="rate-row">
        <label>Your rating:</label>
        <div class="rate-stars" id="rate-stars">
          <span class="rate-star" data-v="1" onclick="setRating(1)" style="font-size:24px;cursor:pointer;">★</span>
<span class="rate-star" data-v="2" onclick="setRating(2)" style="font-size:24px;cursor:pointer;">★</span>
<span class="rate-star" data-v="3" onclick="setRating(3)" style="font-size:24px;cursor:pointer;">★</span>
<span class="rate-star" data-v="4" onclick="setRating(4)" style="font-size:24px;cursor:pointer;">★</span>
<span class="rate-star" data-v="5" onclick="setRating(5)" style="font-size:24px;cursor:pointer;">★</span>
        <span id="rate-label" style="font-size:12px;color:#a8a79f"></span>
      </div>

      <!-- COMMENTS -->
      <div class="comment-form">
        <input type="text" class="comment-input" id="comment-input" placeholder="Add a comment…" maxlength="300">
        <button class="btn btn-primary btn-sm" onclick="postComment()">Post</button>
      </div>
      <div class="comments-list" id="comments-list"></div>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
  if (!Auth.requireAuth('consumer')) throw 0;
  initNavbar();

  let currentFilter = 'all';
  let searchQuery = '';
  let page = 1;
  let hasMore = false;
  let currentPhotoId = null;
  let userRating = 0;
  let searchTimer = null;

  const RATE_LABELS = ['', 'Poor', 'Fair', 'Good', 'Great', 'Excellent'];

  async function loadFeed(reset = true) {
    if (reset) { page = 1; }
    try {
      const params = new URLSearchParams({ page, limit: 8 });
      if (searchQuery) params.set('q', searchQuery);
      if (currentFilter !== 'all' && currentFilter !== 'top') params.set('tag', currentFilter);
      if (currentFilter === 'top') params.set('sort', 'rating');
      const data = await apiFetch('/photos?' + params);
      const grid = document.getElementById('feed-grid');
      const cards = (data.photos || []).map(renderFeedCard).join('');
      if (reset) grid.innerHTML = cards || `<div class="empty-state" style="grid-column:1/-1"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg><h3>No photos found</h3></div>`;
      else grid.insertAdjacentHTML('beforeend', cards);
      hasMore = data.has_more || false;
      document.getElementById('load-more-wrap').style.display = hasMore ? 'block' : 'none';
    } catch(e) { console.error(e); }
  }

  function renderFeedCard(p) {
    const imgEl = p.image_url
      ? `<img class="feed-card-img" src="${p.image_url}" alt="${p.title}" loading="lazy" style="position:relative">`
      : `<div class="feed-card-img" style="background:${photoColor(p.id)}"></div>`;
    return `
      <div class="feed-card" onclick="openPhotoModal(${p.id})">
        <div style="position:relative">
          ${imgEl}
          ${p.location ? `<div class="loc-badge"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/></svg>${p.location}</div>` : ''}
        </div>
        <div class="feed-card-body">
          <div class="feed-card-title">${p.title}</div>
          <div class="feed-card-caption">${p.caption || ''}</div>
          <div class="feed-card-footer">
            <div style="display:flex;align-items:center">
              ${renderStars(p.avg_rating || 0)}
              <span class="rating-count">${p.avg_rating ? p.avg_rating.toFixed(1) : '—'}</span>
            </div>
            <div class="comment-count"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>${p.comment_count || 0}</div>
          </div>
        </div>
      </div>`;
  }

  async function openPhotoModal(id) {
    currentPhotoId = id; userRating = 0;
    resetRatingHover(); document.getElementById('comments-list').innerHTML = '<div class="spinner"></div>';
    openModal('photo-modal');
    try {
      const data = await apiFetch(`/photos/${id}`);
      const p = data.photo;
      document.getElementById('modal-photo-img').src = p.image_url || '';
      document.getElementById('modal-photo-img').style.background = photoColor(id);
      document.getElementById('modal-title').textContent = p.title;
      document.getElementById('modal-meta').innerHTML = `
        ${p.location ? `<span><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/></svg>${p.location}</span>` : ''}
        ${p.people ? `<span><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8z"/></svg>${p.people}</span>` : ''}
        <span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>${timeAgo(p.created_at)}</span>`;
      document.getElementById('modal-caption').textContent = p.caption || '';
      const allTags = [...(p.ai_tags || []), ...(p.tags || [])];
      document.getElementById('modal-tags').innerHTML = allTags.map(t => `<span class="modal-tag">#${t}</span>`).join('');
      await loadComments(id);
    } catch(e) { console.error(e); }
  }

  async function loadComments(id) {
    try {
      const data = await apiFetch(`/photos/${id}/comments`);
      const list = document.getElementById('comments-list');
      if (!(data.comments || []).length) { list.innerHTML = '<p style="font-size:13px;color:#a8a79f;text-align:center;padding:12px 0">No comments yet. Be the first!</p>'; return; }
      list.innerHTML = data.comments.map(c => {
        const initials = c.user_name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
        return `<div class="comment-row">
          <div class="avatar sm consumer">${initials}</div>
          <div class="comment-content">
            <div class="comment-user">${c.user_name}</div>
            <div class="comment-text">${c.text}</div>
            <div class="comment-time">${timeAgo(c.created_at)}</div>
          </div>
        </div>`;
      }).join('');
    } catch(e) {}
  }

  async function postComment() {
    const input = document.getElementById('comment-input');
    const text = input.value.trim(); if (!text) return;
    try {
      await apiFetch(`/photos/${currentPhotoId}/comments`, { method: 'POST', body: JSON.stringify({ text }) });
      input.value = '';
      await loadComments(currentPhotoId);
    } catch(e) { toast(e.message, 'error'); }
  }

  function hoverRating(v) { document.querySelectorAll('.rate-star').forEach(s => s.classList.toggle('lit', +s.dataset.v <= v)); document.getElementById('rate-label').textContent = RATE_LABELS[v]; }
  function resetRatingHover() { document.querySelectorAll('.rate-star').forEach(s => s.classList.toggle('lit', +s.dataset.v <= userRating)); document.getElementById('rate-label').textContent = userRating ? RATE_LABELS[userRating] : ''; }
  async function setRating(v) {
    userRating = v;
    try {
      await apiFetch(`/photos/${currentPhotoId}/rate`, { method: 'POST', body: JSON.stringify({ rating: v }) });
      toast('Rating saved!');
    } catch(e) { toast(e.message, 'error'); }
  }

  function setFilter(f, el) {
    currentFilter = f;
    document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
    el.classList.add('active');
    loadFeed();
  }

  function debounceSearch() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { searchQuery = document.getElementById('search-input').value.trim(); loadFeed(); }, 350);
  }

  function loadMore() { page++; loadFeed(false); }

  async function loadSidebar() {
    try {
      const [trending, creators] = await Promise.all([apiFetch('/photos?sort=rating&limit=3'), apiFetch('/creators')]);
      document.getElementById('trending-list').innerHTML = (trending.photos || []).map(p => `
        <div class="trending-item">
          ${p.image_url ? `<img class="trending-thumb" src="${p.image_url}" alt="">` : `<div class="trending-thumb" style="background:${photoColor(p.id)}"></div>`}
          <div class="trending-info"><div class="trending-title">${p.title}</div><div class="trending-by">by ${p.creator_name || 'creator'}</div></div>
          <span class="hot-badge">${p.avg_rating >= 4.5 ? 'Hot' : 'New'}</span>
        </div>`).join('') || '<p style="font-size:13px;color:#a8a79f">Nothing yet</p>';

      document.getElementById('creators-list').innerHTML = (creators.creators || []).map(c => {
        const initials = c.name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
        return `<div class="creator-item">
          <div class="avatar sm creator">${initials}</div>
          <div class="creator-item-info"><div class="creator-name">${c.name}</div><div class="creator-count">${c.photo_count} photos</div></div>
          <button class="follow-btn" onclick="toggleFollow(this)">Follow</button>
        </div>`;
      }).join('') || '<p style="font-size:13px;color:#a8a79f">No creators yet</p>';
    } catch(e) {}
  }

  function toggleFollow(btn) { btn.classList.toggle('following'); btn.textContent = btn.classList.contains('following') ? 'Following' : 'Follow'; }

  document.getElementById('comment-input').addEventListener('keydown', e => { if (e.key === 'Enter') postComment(); });

  loadFeed();
  loadSidebar();
</script>
</body>
</html>
